{{- $limit := .Get "limit" | default "text" -}}
{{- $section := .Get "section" | default "blog" -}}
{{- $pages := where site.RegularPages "Section" $section }}
<ul>
  {{- with $pages }}
    {{- range .Limit $limit }}
      <li>
        <a href="{{ .Permalink }}">{{ .Title }}</a><br>
        {{ .Lastmod.Format "2006-01-02" }}
      </li>
    {{- end }}
  {{- end }}
</ul>

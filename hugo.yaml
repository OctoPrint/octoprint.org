baseURL: https://octoprint.org/
locale: en-us
title: OctoPrint.org
theme:
- liftoff

enableRobotsTXT: true
enableEmoji: false
pagination:
  pagerSize: 10

params:
  product: OctoPrint
  tagline: Your printer. Your rules.
  accent: octoprint
  copyrightOwner: Gina Häußge
  copyrightSuffix: ""
  legalFooter: |
    "OctoPrint" is a [registered trademark](/trademark-rules) &middot;
    [Imprint](/imprint) &middot;
    [Privacy Policy](/privacy)
  carbon: "//cdn.carbonads.com/carbon.js?serve=CKYIL53W&placement=octoprintorg"
  social:
    - icon: simple-icons:github
      name: GitHub
      url: https://github.com/OctoPrint/OctoPrint
    - icon: simple-icons:discourse
      name: Forum
      url: https://community.octoprint.org
    - icon: simple-icons:discord
      name: Discord
      url: https://discord.octoprint.org
    - icon: simple-icons:mastodon
      name: Mastodon
      url: https://floss.social/@OctoPrint
    - icon: mdi:rss
      name: RSS
      url: /feed.xml

menus:
  main:
    - name: Blog
      pageRef: /blog
      weight: 20
    - name: Get Help
      pageRef: /help
      weight: 30
    - name: Download
      pageRef: /download
      weight: 40
    - name: Docs
      url: https://docs.octoprint.org
      weight: 50
      params:
        target: _blank
    - name: Merchandise
      pageRef: /merch
      weight: 60

  footer:
    - identifier: links
      name: Links
      weight: 10
    - parent: links
      name: Documentation
      url: https://docs.octoprint.org
      weight: 10
      params:
        target: _blank
    - parent: links
      name: GitHub
      url: https://github.com/OctoPrint
      weight: 20
      params:
        target: _blank
    - parent: links
      name: Community Forum
      url: https://community.octoprint.org
      weight: 30
      params:
        target: _blank
    - parent: links
      name: Discord
      url: https://discord.octoprint.org
      weight: 40
      params:
        target: _blank
    - parent: links
      name: Mastodon
      url: https://floss.social/@OctoPrint
      weight: 50
      params:
        target: _blank
    - parent: links
      name: YouTube
      url: https://www.youtube.com/c/OctoPrint3D
      weight: 60    
      params:
        target: _blank
    - parent: links
      name: Browser Check
      pageRef: /browser-check/
      weight: 70
    - parent: links
      name: Status Page
      url: https://status.octoprint.org/
      weight: 80
      params:
        target: _blank

    - identifier: legal
      name: Rules & Policies
      weight: 20
    - parent: legal
      name: Code of Conduct
      pageRef: /coc/
      weight: 10
    - parent: legal
      name: Security Policy
      pageRef: /security/
      weight: 20
    - parent: legal
      name: Trademark Policy
      pageRef: /trademark/
      weight: 30
    - parent: legal
      name: Anonymous Usage Tracking in OctoPrint
      pageRef: /tracking/
      weight: 40

frontmatter:
  date:
  - date
  - publishdate
  - pubdate
  - published

  lastmod:
  - lastmod
  - modified

permalinks:
  page:
    blog: /blog/:year/:month/:day/:slug/

services:
  rss:
    limit: 10

mainSections:
- blog

outputs:
  home:
    - html
    - allRSS
    - releasesRSS
    - importantRSS
    - octoblogRSS
    - octopiRSS
    - rss
    - search
  term:
    - html
    - rss

outputFormats:
  rss:
    basename: feed
  allRSS:
    mediaType: application/rss
    basename: feeds/all
    notAlternative: true
  releasesRSS:
    mediaType: application/rss
    basename: feeds/releases
    notAlternative: true
  importantRSS:
    mediaType: application/rss
    basename: feeds/important
    notAlternative: true
  octopiRSS:
    mediaType: application/rss
    basename: feeds/octopi
    notAlternative: true
  octoblogRSS:
    mediaType: application/rss
    basename: feeds/octoblog
    notAlternative: true
  search:
    mediaType: application/json
    basename: search
    notALternative: true

markup:
  highlight:
    style: github-dark
    noClasses: false
    lineNos: false
    codeFences: true
    tabWidth: 2
  goldmark:
    renderer:
      unsafe: true

privacy:
  youTube:
    disable: false
    privacyEnhanced: true

module:
  hugoVersion:
    extended: true
    min: 0.146.0
